<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Huevos Frescos - Pago</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                        "content-light": "#181611",
                        "content-dark": "#e6e2db",
                        "subtle-light": "#8a7c60",
                        "subtle-dark": "#a19883",
                        "border-light": "#e6e2db",
                        "border-dark": "#3a3324",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .form-radio:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='%23221c10' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-content-light dark:text-content-dark">
    <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-10 w-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
            <div class="container mx-auto px-4">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center gap-6">
                        <a class="flex items-center gap-2" href="/template-ecommerce-huevos-frescos/">
                            <svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 48 48"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor">
                                </path>
                            </svg>
                            <h1 class="text-xl font-bold text-zinc-900 dark:text-zinc-100">Fresh Eggs</h1>
                        </a>
                        <nav class="hidden md:flex items-center gap-6" id="navMenu">
                            <a class="text-sm font-medium text-zinc-700 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="/template-ecommerce-huevos-frescos/">Inicio</a>
                            <a class="text-sm font-medium text-zinc-700 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="/template-ecommerce-huevos-frescos/productos/">Productos</a>
                            <a class="text-sm font-medium text-zinc-700 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="/template-ecommerce-huevos-frescos/nosotros/">Acerca de nosotros</a>
                            <a class="text-sm font-medium text-zinc-700 dark:text-zinc-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="/template-ecommerce-huevos-frescos/contacto/">Contacto</a>
                        </nav>
                    </div>
                    <div class="flex items-center gap-4">
                        <a href="/template-ecommerce-huevos-frescos/carrito/"
                            class="flex items-center justify-center rounded-full p-2 hover:bg-primary/20 dark:hover:bg-primary/30 transition-colors">
                            <span class="material-symbols-outlined text-zinc-900 dark:text-zinc-100"> shopping_cart
                            </span>
                        </a>
                        <a href="/template-ecommerce-huevos-frescos/perfil/" class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCHzYqeT0bWXoXqaStv2LZSlVN2EOtQt5lJFM-YjpJAa5qsfcsGj4P2E1BztyiU4u8QWbIOYllmeajTx_7ni_-B2PNcBbzXTmn-wdMPKto_bY6ID-Jze42U80CWQgeCHjML5qF4UJe3kwLXYcBEDB8MS4eMXVlEL8-yqlR0KV9TCv-WoSqiP7Xhr1iTIggjIgEn2s8j5uCEMSzDjA2_i8X4T4ikqOioxDwSCdJ64LFjLjjV6aLjsg0nCOepR3Krgueqjht4dit-Z1qs");'>
                        </a>
                        <button class="md:hidden text-gray-900 dark:text-white" id="btnMenu">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-grow">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
                    <div class="lg:col-span-1">
                        <div class="space-y-8">
                            <div>
                                <nav class="text-sm font-medium text-subtle-light dark:text-subtle-dark">
                                    <a class="hover:text-primary dark:hover:text-primary" href="/template-ecommerce-huevos-frescos/carrito/">Carrito</a>
                                    <span class="mx-2">/</span>
                                    <span class="text-content-light dark:text-content-dark">Pago</span>
                                </nav>
                                <h2
                                    class="mt-4 text-4xl font-bold tracking-tight text-content-light dark:text-content-dark">
                                    Pago</h2>
                            </div>
                            <form class="space-y-6">
                                <div class="space-y-6">
                                    <h3 class="text-xl font-semibold">Información de Envío</h3>
                                    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                                        <div class="sm:col-span-6">
                                            <label class="block text-sm font-medium" for="email">Dirección de correo
                                                electrónico</label>
                                            <div class="mt-1">
                                                <input autocomplete="email"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="email" name="email" placeholder="tu@ejemplo.com" type="email" />
                                            </div>
                                        </div>
                                        <div class="sm:col-span-6">
                                            <label class="block text-sm font-medium" for="address">Dirección</label>
                                            <div class="mt-1">
                                                <input autocomplete="street-address"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="address" name="address" placeholder="Calle Principal 123"
                                                    type="text" />
                                            </div>
                                        </div>
                                        <div class="sm:col-span-2">
                                            <label class="block text-sm font-medium" for="city">Ciudad</label>
                                            <div class="mt-1">
                                                <input autocomplete="address-level2"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="city" name="city" placeholder="Tu Ciudad" type="text" />
                                            </div>
                                        </div>
                                        <div class="sm:col-span-2">
                                            <label class="block text-sm font-medium" for="state">Estado /
                                                Provincia</label>
                                            <div class="mt-1">
                                                <input autocomplete="address-level1"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="state" name="state" placeholder="Estado" type="text" />
                                            </div>
                                        </div>
                                        <div class="sm:col-span-2">
                                            <label class="block text-sm font-medium" for="zip">Código Postal</label>
                                            <div class="mt-1">
                                                <input autocomplete="postal-code"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="zip" name="zip" placeholder="12345" type="text" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-6">
                                    <h3 class="text-xl font-semibold">Método de Envío</h3>
                                    <div class="space-y-4">
                                        <label
                                            class="flex items-center gap-4 rounded-lg border p-4 cursor-pointer border-border-light dark:border-border-dark has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
                                            <input checked=""
                                                class="form-radio h-5 w-5 text-primary border-border-light dark:border-border-dark focus:ring-primary"
                                                name="shipping-method" type="radio" value="standard" />
                                            <div class="flex-grow">
                                                <p class="font-medium">Estándar (3-5 días hábiles)</p>
                                                <p class="text-sm text-subtle-light dark:text-subtle-dark">Gratis</p>
                                            </div>
                                        </label>
                                        <label
                                            class="flex items-center gap-4 rounded-lg border p-4 cursor-pointer border-border-light dark:border-border-dark has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
                                            <input
                                                class="form-radio h-5 w-5 text-primary border-border-light dark:border-border-dark focus:ring-primary"
                                                name="shipping-method" type="radio" value="express" />
                                            <div class="flex-grow">
                                                <p class="font-medium">Express (1-2 días hábiles)</p>
                                                <p class="text-sm text-subtle-light dark:text-subtle-dark">$10.00</p>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                                <div class="space-y-6">
                                    <h3 class="text-xl font-semibold">Detalles de Pago</h3>
                                    <div class="space-y-4">
                                        <label
                                            class="flex items-center gap-4 rounded-lg border p-4 cursor-pointer border-border-light dark:border-border-dark has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
                                            <input checked=""
                                                class="form-radio h-5 w-5 text-primary border-border-light dark:border-border-dark focus:ring-primary"
                                                name="payment-method" type="radio" value="credit-card" />
                                            <span class="font-medium">Tarjeta de Crédito</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-4 rounded-lg border p-4 cursor-pointer border-border-light dark:border-border-dark has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
                                            <input
                                                class="form-radio h-5 w-5 text-primary border-border-light dark:border-border-dark focus:ring-primary"
                                                name="payment-method" type="radio" value="paypal" />
                                            <span class="font-medium">PayPal</span>
                                        </label>
                                    </div>
                                    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-4">
                                        <div class="sm:col-span-4">
                                            <label class="block text-sm font-medium" for="card-number">Número de
                                                tarjeta</label>
                                            <div class="mt-1">
                                                <input autocomplete="cc-number"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="card-number" name="card-number"
                                                    placeholder="0000 0000 0000 0000" type="text" />
                                            </div>
                                        </div>
                                        <div class="sm:col-span-2">
                                            <label class="block text-sm font-medium" for="expiration-date">Fecha de
                                                vencimiento (MM/AA)</label>
                                            <div class="mt-1">
                                                <input autocomplete="cc-exp"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="expiration-date" name="expiration-date" placeholder="MM/AA"
                                                    type="text" />
                                            </div>
                                        </div>
                                        <div class="sm:col-span-2">
                                            <label class="block text-sm font-medium" for="cvc">CVC</label>
                                            <div class="mt-1">
                                                <input autocomplete="cc-csc"
                                                    class="block w-full rounded border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:ring-primary focus:border-primary placeholder-subtle-light dark:placeholder-subtle-dark"
                                                    id="cvc" name="cvc" placeholder="123" type="text" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="lg:col-span-1">
                        <div class="sticky top-20">
                            <div
                                class="bg-background-light dark:bg-background-dark/50 rounded-lg border border-border-light dark:border-border-dark p-6">
                                <h3 class="text-xl font-semibold">Resumen del Pedido</h3>
                                <div class="mt-6 space-y-4">
                                    <div class="flex justify-between">
                                        <p class="text-subtle-light dark:text-subtle-dark">Subtotal</p>
                                        <p>$18.00</p>
                                    </div>
                                    <div class="flex justify-between">
                                        <p class="text-subtle-light dark:text-subtle-dark">Envío</p>
                                        <p>Gratis</p>
                                    </div>
                                    <div
                                        class="flex justify-between border-t border-border-light dark:border-border-dark pt-4 font-semibold">
                                        <p>Total</p>
                                        <p>$18.00</p>
                                    </div>
                                </div>
                                <button id="btnSubmitOrder"
                                    class="mt-8 w-full bg-primary text-background-dark font-bold py-3 px-4 rounded-lg hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background-light dark:focus:ring-offset-background-dark">
                                    Realizar Pedido
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../main.js"></script>
    <script>
        document.getElementById("btnSubmitOrder").addEventListener("click", function () {
            window.location.href = "/template-ecommerce-huevos-frescos/confirmacion/";
        });
    </script>
</body>

</html>
